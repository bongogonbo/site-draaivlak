<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Contact</title>
<style>.hp{position:absolute;left:-9999px}</style></head>
<body>
<form class="aanvraag" data-webhook="https://app.example.test/hooks/aanvraag" data-site-id="test-site" data-telefoon="010 123 45 67" data-bedankt="bedankt.html" novalidate>
  <label for="f-naam">Naam</label>
  <input id="f-naam" name="naam" autocomplete="name" required>
  <label for="f-telefoon">Telefoon</label>
  <input id="f-telefoon" name="telefoon" type="tel" autocomplete="tel" required>
  <label for="f-email">E-mail</label>
  <input id="f-email" name="email" type="email" autocomplete="email">
  <label for="f-postcode">Postcode</label>
  <input id="f-postcode" name="postcode" autocomplete="postal-code" pattern="[1-9][0-9]{3} ?[A-Za-z]{2}">
  <label for="f-onderwerp">Onderwerp</label>
  <select id="f-onderwerp" name="onderwerp"><option>Offerte</option><option>Vraag</option></select>
  <label for="f-bericht">Bericht</label>
  <textarea id="f-bericht" name="bericht" rows="5" required></textarea>
  <div class="hp" aria-hidden="true"><label for="f-website">Laat dit veld leeg</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
  <button type="submit">Verstuur aanvraag</button>
  <p class="status" role="status" aria-live="polite"></p>
</form>
<script src="../site/assets/js/formulier.js"></script>
</body></html>
